version: '3.8'

services:
  judge:
    build:
      context: .
      dockerfile: Dockerfile
    image: jutge:latest
    container_name: jutge_runner
    
    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Seguridad
    networks:
      - isolated
    read_only: true
    tmpfs:
      - /tmp
      - /submissions
      - /test_cases
    
    # Volúmenes
    volumes:
      - ./submissions:/submissions:ro
      - ./test_cases:/test_cases:ro
      - ./results:/results:rw

networks:
  isolated:
    driver: bridge
